<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">

  <!-- === T LETTER === -->
  <!-- T top bar -->
  <rect x="64" y="175" width="175" height="26" rx="8" fill="black" />
  <!-- T stem -->
  <rect x="139" y="175" width="26" height="200" rx="8" fill="black" />

  <!-- === G LETTER === -->
  <!-- G arc -->
  <path d="M 448 200 A 108 115 0 1 0 448 312" fill="none" stroke="black" stroke-width="28" stroke-linecap="round" />
  <!-- G horizontal arm -->
  <line x1="448" y1="312" x2="355" y2="312" stroke="black" stroke-width="28" stroke-linecap="round" />
  <!-- G short vertical -->
  <line x1="355" y1="312" x2="355" y2="262" stroke="black" stroke-width="28" stroke-linecap="round" />

  <!-- === TELECOM TOWER inside T stem === -->
  <!-- Tower legs -->
  <line x1="152" y1="375" x2="125" y2="230" stroke="#cc1111" stroke-width="7" stroke-linecap="round" />
  <line x1="152" y1="375" x2="179" y2="230" stroke="#cc1111" stroke-width="7" stroke-linecap="round" />
  <!-- Cross braces top -->
  <line x1="131" y1="260" x2="173" y2="248" stroke="#cc1111" stroke-width="5" stroke-linecap="round" />
  <line x1="173" y1="260" x2="131" y2="248" stroke="#cc1111" stroke-width="5" stroke-linecap="round" />
  <!-- Cross braces mid -->
  <line x1="136" y1="302" x2="168" y2="288" stroke="#cc1111" stroke-width="5" stroke-linecap="round" />
  <line x1="168" y1="302" x2="136" y2="288" stroke="#cc1111" stroke-width="5" stroke-linecap="round" />
  <!-- Cross braces low -->
  <line x1="141" y1="344" x2="163" y2="330" stroke="#cc1111" stroke-width="5" stroke-linecap="round" />
  <line x1="163" y1="344" x2="141" y2="330" stroke="#cc1111" stroke-width="5" stroke-linecap="round" />
  <!-- Tower top mast -->
  <line x1="152" y1="185" x2="152" y2="230" stroke="#cc1111" stroke-width="7" stroke-linecap="round" />

  <!-- === SIGNAL WAVES === -->
  <!-- Signal dot at top of mast -->
  <circle cx="152" cy="180" r="9" fill="#cc1111" />
  <!-- Inner wave -->
  <path d="M 128 172 Q 152 148 176 172" fill="none" stroke="#cc1111" stroke-width="9" stroke-linecap="round" />
  <!-- Middle wave -->
  <path d="M 112 155 Q 152 124 192 155" fill="none" stroke="#cc1111" stroke-width="9" stroke-linecap="round" />
  <!-- Outer wave -->
  <path d="M 96 138 Q 152 100 208 138" fill="none" stroke="#cc1111" stroke-width="9" stroke-linecap="round" />

  <!-- === SIGNAL BARS inside G === -->
  <rect x="295" y="285" width="16" height="26" rx="4" fill="#cc1111" />
  <rect x="320" y="270" width="16" height="41" rx="4" fill="#cc1111" />
  <rect x="345" y="255" width="16" height="56" rx="4" fill="#cc1111" />

  <!-- === RED SWOOSH at bottom === -->
  <path d="M 72 438 Q 256 490 440 438" fill="none" stroke="#cc1111" stroke-width="16" stroke-linecap="round" />
</svg>