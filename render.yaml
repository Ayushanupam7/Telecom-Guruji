services:
  - type: web
    name: telecom-guruji-web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:web
    startCommand: npm run start --workspace=@signalhub/web
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_DISABLE_SWC_LOCKFILE_PATCH
        value: "1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

